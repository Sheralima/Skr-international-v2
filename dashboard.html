<!DOCTYPE html>
<html>
<head>
<title>SKR Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial; background:#f4f7f9; margin:0; }
  .header { background:#0d6efd; color:white; padding:20px; display:flex; justify-content:space-between; align-items:center; }
  .header button { background:white; color:#0d6efd; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
  .container { padding:30px; max-width:900px; margin:auto; }
  .card { background:white; padding:25px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); margin-bottom:20px; }
  .card h2 { color:#0d6efd; margin-top:0; }
  .course { background:#e7f1ff; padding:15px; border-radius:10px; margin:10px 0; }
</style>
</head>
<body>
<div class="header">
  <h2>SKR International Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">
  <div class="card">
    <h2 id="userName">Loading...</h2>
    <p id="userEmail"></p>
  </div>

  <div class="card">
    <h2>My Courses</h2>
    <div id="coursesList">
      <p>Loading courses...</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    // 1. USER KA NAAM LANA
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if(userDoc.exists()){
      document.getElementById('userName').innerText = "Welcome, " + userDoc.data().name;
      document.getElementById('userEmail').innerText = user.email;
    }

    // 2. COURSES LANA
    const querySnapshot = await getDocs(collection(db, "courses"));
    let coursesHTML = "";
    querySnapshot.forEach((doc) => {
      coursesHTML += `<div class="course"><b>${doc.data().title}</b><p>${doc.data().desc}</p></div>`;
    });
    document.getElementById('coursesList').innerHTML = coursesHTML || "<p>No courses yet.</p>";

  } else {
    window.location.href = "login.html";
  }
});

window.logout = async () => {
  await signOut(auth);
  window.location.href = "login.html";
}
</script>
</body>
</html>
