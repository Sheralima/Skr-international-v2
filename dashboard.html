<!DOCTYPE html>
<html>
<head>
<title>SKR Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial; background:#f4f7f9; margin:0; }
  .header { background:#0d6efd; color:white; padding:20px; display:flex; justify-content:space-between; align-items:center; }
  .header button { background:white; color:#0d6efd; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
  .container { padding:30px; max-width:900px; margin:auto; }
  .welcome { background:white; padding:25px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  .welcome h2 { color:#0d6efd; margin:0; }
</style>
</head>
<body>
<div class="header">
  <h2>SKR International Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">
  <div class="welcome">
    <h2 id="userName">Loading...</h2>
    <p>Welcome to SKR International. Your learning journey starts here.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Check karega user login hai ya nahi
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('userName').innerText = "Welcome, " + user.email;
  } else {
    window.location.href = "login.html"; // Agar login nahi to wapas bhej dega
  }
});

window.logout = async () => {
  await signOut(auth);
  window.location.href = "login.html";
}
</script>
</body>
</html>
