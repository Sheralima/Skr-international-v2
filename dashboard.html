<!DOCTYPE html>
<html>
<head>
<title>SKR Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: 'Arial'; background:#f4f7f9; margin:0; }
  .navbar { background:#0d6efd; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; }
  .navbar h2 { margin:0; }
  .navbar button { background:white; color:#0d6efd; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; cursor:pointer; }
  .container { padding:30px 20px; max-width:900px; margin:auto; }
  .card { background:white; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); margin-bottom:20px; }
  .card h3 { color:#0d6efd; margin-top:0; }
  .welcome { font-size:20px; color:#333; }
</style>
</head>
<body>

<div class="navbar">
  <h2>SKR International</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">
  <div class="card">
    <h3>Welcome to Dashboard</h3>
    <p class="welcome" id="userEmail">Loading...</p>
    <p>Aap successfully login ho gaye hain ✅</p>
  </div>

  <div class="card">
    <h3>Your Account Info</h3>
    <p><b>Email:</b> <span id="emailShow"></span></p>
    <p><b>UID:</b> <span id="uidShow"></span></p>
  </div>

  <div class="card">
    <h3>Quick Links</h3>
    <p>Yahan aap apne courses, profile, waghera ke button laga sakte hain.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Check karo user login hai ya nahi
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('userEmail').innerText = "Hello, " + user.email;
    document.getElementById('emailShow').innerText = user.email;
    document.getElementById('uidShow').innerText = user.uid;
  } else {
    // agar login nahi hai to login page pe bhej do
    alert("Please login first");
    window.location.href = "login.html";
  }
});

window.logout = async () => {
  await signOut(auth);
  alert("Logged out");
  window.location.href = "login.html";
}
</script>
</body>
</html>
