<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKR International - Register</title>
<style>
  body { font-family: Arial; background: linear-gradient(135deg, #00c853, #2962ff); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: center; }
  h1 { color: #2962ff; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #00c853; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:disabled { background: #aaa; }
</style>
</head>
<body>
<div class="box">
  <h1>SKR International</h1>
  <h3>Create Account</h3>
  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="btn" onclick="register()">Register</button>
  <p>Done? <a href="dashboard.html">Go to Dashboard</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const app = initializeApp({apiKey:"AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",authDomain:"skr-website-v2.firebaseapp.com",projectId:"skr-website-v2"});
  const auth = getAuth(app); const db = getFirestore(app);

  window.register = async () => {
    const btn = document.getElementById('btn'); btn.innerText = "Registering..."; btn.disabled = true;
    try{
      const user = await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
      await setDoc(doc(db, "users", user.user.uid), {name: document.getElementById('name').value, email: document.getElementById('email').value});
      alert("Account Created Successfully! ✅");
      btn.innerText = "Register"; btn.disabled = false;
    }catch(e){ alert("ERROR: "+e.message); btn.innerText = "Register"; btn.disabled = false; }
  }
</script>
</body>
</html>
