<!DOCTYPE html>
<html>
<head><title>Register - SKR</title>
<style>
body {font-family:Arial; background:#0d6efd; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box {background:white; padding:30px; border-radius:12px; width:350px; text-align:center;}
input {width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
button {width:100%; padding:12px; background:#0d6efd; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
</style>
</head>
<body>
<div class="box">
  <h2>Create SKR Account</h2>
  <form id="regForm" autocomplete="off">
    <input type="email" id="email" placeholder="Enter NEW Email" required>
    <input type="password" id="password" placeholder="Password 6+ chars" required>
    <button type="submit" id="btn">Register</button>
  </form>
  <p>Already have account? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Page load pe logout taake cache clear ho
await signOut(auth);

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerText = "Creating...";
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  try {
    const userCred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", userCred.user.uid), {email: email, balance: 0});
    alert("SUCCESS! Account ban gaya");
    window.location.href = "login.html";
  } catch (error) {
    alert("ERROR: " + error.code + "\n" + error.message);
    btn.disabled = false;
    btn.innerText = "Register";
  }
})
</script>
</body>
</html>
