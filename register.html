<!DOCTYPE html>
<html>
<head><title>Register - SKR</title></head>
<body style="text-align:center; padding:50px; font-family:Arial;">
<h2>SKR Register</h2>
<input id="email" type="email" placeholder="new email" style="padding:10px; width:250px;"><br><br>
<input id="password" type="password" placeholder="password 6+ chars" style="padding:10px; width:250px;"><br><br>
<button id="btn" onclick="register()" style="padding:12px 25px; background:#0d6efd; color:white; border:none; border-radius:8px;">Register</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = async () => {
  document.getElementById('btn').innerText = "Creating...";
  document.getElementById('btn').disabled = true;
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  
  try{
    await createUserWithEmailAndPassword(auth, email, password);
    alert("SUCCESS! Account ban gaya");
    document.getElementById('btn').innerText = "Register";
  }catch(e){
    alert("ERROR CODE: " + e.code + "\n" + e.message);
    document.getElementById('btn').innerText = "Register";
    document.getElementById('btn').disabled = false;
  }
}
</script>
</body>
</html>
