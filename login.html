<!DOCTYPE html>
<html>
<head><title>Login - SKR</title></head>
<body style="text-align:center; padding:50px;">
<h2>SKR Login</h2>
<input id="email" type="email" placeholder="email" style="padding:10px;"><br><br>
<input id="password" type="password" placeholder="password" style="padding:10px;"><br><br>
<button onclick="login()">Login</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDeKanWCH9u8adC1Pq2_4eCBXD0MRAvdc4",
  authDomain: "skr-website-v2.firebaseapp.com",
  projectId: "skr-website-v2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try{
    await signInWithEmailAndPassword(auth, email, password);
    alert("LOGIN SUCCESS!");
    window.location.href = "dashboard.html"; // dashboard pe bhej dega
  }catch(e){
    alert("ERROR: " + e.code);
  }
}
</script>
</body>
</html>
