<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SKR INTERNATIONAL</title>
<style>
body { font-family: Arial; background: #0d6efd; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.login-box { width:380px; background:#fff; padding:30px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.3); text-align: center; }
.login-box h2 { color:#0d6efd; margin-bottom:20px; }
.login-box input { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:8px; font-size:16px; box-sizing: border-box; }
.login-box button { width:100%; padding:12px; background:#0d6efd; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="login-box">
  <h2>Login to SKR</h2>
  <input type="email" id="email" placeholder="Enter Email" required>
  <input type="password" id="password" placeholder="Enter Password" required>
  <button id="loginBtn">Login</button>
  <p>Account nahi hai? <a href="register.html">Register Here</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCpJo0r1dNf43PvZqpIyAf3HHIx7IHlTQg",
  authDomain: "my-website-2d77f.firebaseapp.com",
  projectId: "my-website-2d77f"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("Login Success! ✅");
    window.location.href = "dashboard.html";
  } catch (error) {
    alert("Error: " + error.message);
  }
})
</script>
</body>
</html>
