<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - SKR INTERNATIONAL</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">

<style>
  body { font-family: 'Segoe UI', Arial; background: #f4f7ff; margin: 0; }
  
  header { 
    background: linear-gradient(135deg, #1a1a2e, #0f3460); 
    color: white; text-align: center; padding: 40px 20px;
  }
  header h1 { margin: 0; font-size: 32px; }
  header p { margin: 5px 0 0; opacity: 0.8; }

  nav { 
    background: #16213e; padding: 15px; text-align: center; 
    position: sticky; top: 0; z-index: 100;
  }
  nav a { 
    color: white; text-decoration: none; margin: 0 18px; font-weight: 600;
    transition: 0.3s; font-size: 16px;
  }
  nav a:hover { color: #00d4ff; transform: scale(1.1); display: inline-block; }

  .contact { 
    max-width: 1100px; margin: 40px auto; padding: 20px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
  }
  .contact h2 { grid-column: 1/-1; text-align: center; color: #1a1a2e; font-size: 28px; }

  .form-box, .info-box {
    background: white; padding: 30px; border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  .form-box input, .form-box textarea {
    width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #ddd;
    border-radius: 8px; font-size: 15px; outline: none;
    transition: 0.3s;
  }
  .form-box input:focus, .form-box textarea:focus {
    border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.2);
  }
  .form-box textarea { height: 120px; resize: none; }

  .btn {
    width: 100%; padding: 14px; background: linear-gradient(90deg, #007bff, #00d4ff);
    color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,123,255,0.4); }

  .info-box h3 { color: #007bff; margin-bottom: 20px; }
  .info-box p { font-size: 16px; margin: 15px 0; display: flex; align-items: center; gap: 10px; }
  .info-box i { color: #007bff; font-size: 20px; }

  footer { 
    background: #1a1a2e; color: white; text-align: center; 
    padding: 20px; margin-top: 40px;
  }

  @media(max-width: 768px) {
    .contact { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
