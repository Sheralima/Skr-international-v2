<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - SKR International</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; margin: 0; padding: 20px; }
    .profile-card {
      max-width: 500px; margin: 40px auto; background: white; 
      padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .profile-pic { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; }
    .info { text-align: left; margin-top: 20px; }
    .info p { font-size: 16px; margin: 10px 0; }
    .balance { font-size: 22px; color: green; font-weight: bold; }
    .btn { padding: 10px 20px; background: #007bff; color: white; border: none; 
           border-radius: 5px; cursor: pointer; margin-top: 20px; }
    .btn:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="profile-card">
    <img src="https://via.placeholder.com/100" class="profile-pic" alt="Profile">
    <h2 id="profileName">Loading...</h2>
    
    <div class="info">
      <p><b>Email:</b> <span id="profileEmail"></span></p>
      <p><b>Phone:</b> <span id="profilePhone"></span></p>
      <p><b>Address:</b> <span id="profileAddress"></span></p>
      <p><b>Balance:</b> <span class="balance">Rs <span id="profileBalance">0</span></span></p>
    </div>

    <button class="btn" onclick="window.location.href='index.html'">Back to Home</button>
  </div>
<script type="module" src="fiebase.js"></script>
</body>
</html>
